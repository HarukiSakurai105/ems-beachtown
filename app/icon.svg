<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d5a"/>
      <stop offset="45%" stop-color="#e63946"/>
      <stop offset="100%" stop-color="#9e111a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Outer Shield / Rounded Square -->
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="100" fill="none" stroke="#ffffff" stroke-width="14" stroke-opacity="0.3"/>
  
  <!-- Medical Star of Life (6 Bars) -->
  <g fill="#ffffff" filter="url(#shadow)">
    <!-- Vertical bar -->
    <rect x="216" y="96" width="80" height="320" rx="20"/>
    <!-- Diagonal 1 -->
    <rect x="216" y="96" width="80" height="320" rx="20" transform="rotate(60 256 256)"/>
    <!-- Diagonal 2 -->
    <rect x="216" y="96" width="80" height="320" rx="20" transform="rotate(120 256 256)"/>
  </g>
  
  <!-- Inner Red Accent Ring -->
  <circle cx="256" cy="256" r="48" fill="#e63946"/>
  
  <!-- Asclepius Staff / Golden Rod in Center -->
  <path d="M250 160 h12 v192 h-12 z" fill="#ffffff" rx="6"/>
  <circle cx="256" cy="150" r="14" fill="#ffffff"/>
</svg>
